[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-monitor"
version = "0.1.0"
description = "Daily ascending-channel breakout monitor for NASDAQ and KOSPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.28",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
krx = ["pykrx>=1.0.45"]
test = ["pytest>=7.0"]

[project.scripts]
channel-monitor = "channel_monitor.cli:main"

[tool.setuptools]
packages = ["channel_monitor"]

[tool.setuptools.package-data]
channel_monitor = ["resources/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
